<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin • MARKMELLON Gallery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" type="image/webp" href="https://ik.imagekit.io/s95tumxuk/IMG_0829.jpeg?updatedAt=1774445391360">
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap');
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: linear-gradient(rgba(0,0,0,0.92), rgba(0,0,0,0.97));
      min-height: 100vh;
    }
    .glass { 
      background: rgba(255,255,255,0.09);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.15);
    }
    .card-hover:hover { transform: translateY(-4px); }
    .live-preview {
      background-size: cover;
      background-position: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body class="text-white p-6">

  <div class="max-w-screen-2xl mx-auto">
    <div class="flex justify-between items-center mb-10">
      <div>
        <h1 class="text-4xl font-bold tracking-tight">MARKMELLON <span class="text-blue-400">ADMIN PANEL</span></h1>
        <p class="text-zinc-400 mt-1">Full Gallery & Website Management</p>
      </div>
      <button onclick="logout()" class="px-8 py-3 bg-red-600 hover:bg-red-700 rounded-3xl font-medium">Logout</button>
    </div>

    <!-- LIVE WEBSITE PREVIEW -->
    <div class="glass rounded-3xl p-8 mb-12">
      <h2 class="text-2xl font-semibold mb-6">Website Live Preview</h2>
      <div id="livePreview" class="live-preview h-80 rounded-3xl relative overflow-hidden border border-white/20">
        <div class="absolute inset-0 bg-black/50 flex items-center justify-center">
          <div class="text-center">
            <p class="text-sm opacity-75">Real-time Preview of Your Homepage</p>
          </div>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

      <!-- ADD NEW IMAGE -->
      <div class="glass rounded-3xl p-8">
        <h2 class="text-2xl font-semibold mb-6">Add New Image</h2>
        <div class="space-y-5">
          <input id="imgSrc" placeholder="Image URL" class="w-full glass rounded-2xl px-5 py-4">
          <input id="imgTitle" placeholder="Image Title" class="w-full glass rounded-2xl px-5 py-4">
          <select id="imgAlbum" class="w-full glass rounded-2xl px-5 py-4">
            <option value="">Add to All Images only</option>
          </select>
          <button onclick="addNewImage()" class="w-full py-5 bg-gradient-to-r from-blue-500 to-purple-600 rounded-3xl font-semibold text-lg">
            Add Image
          </button>
        </div>
      </div>

      <!-- CREATE NEW ALBUM -->
      <div class="glass rounded-3xl p-8">
        <h2 class="text-2xl font-semibold mb-6">Create New Album</h2>
        <input id="albumTitle" placeholder="Album Title" class="w-full glass rounded-2xl px-5 py-4 mb-4">
        <input id="albumCover" placeholder="Cover Image URL" class="w-full glass rounded-2xl px-5 py-4 mb-6">
        <button onclick="createNewAlbum()" class="w-full py-5 bg-gradient-to-r from-purple-500 to-pink-600 rounded-3xl font-semibold text-lg">
          Create Album
        </button>
      </div>

      <!-- QUICK ACTIONS -->
      <div class="glass rounded-3xl p-8">
        <h2 class="text-2xl font-semibold mb-6">Quick Actions</h2>
        <button onclick="refreshAll()" class="w-full py-4 glass rounded-3xl mb-3 hover:bg-white/10 transition-colors">Refresh All Data</button>
      </div>
    </div>

    <!-- BACKGROUND IMAGE -->
    <div class="glass rounded-3xl p-8 mt-10">
      <h2 class="text-2xl font-semibold mb-6">Website Background Image</h2>
      <div id="currentBackgroundPreview" class="mb-6 rounded-2xl overflow-hidden border border-white/10 h-56 bg-zinc-900"></div>
      <input id="backgroundUrlInput" type="text" placeholder="https://example.com/background.jpg" 
             class="w-full glass rounded-2xl px-6 py-5 mb-6">
      <button onclick="updateBackgroundImage()" 
              class="w-full py-5 bg-gradient-to-r from-blue-500 to-purple-600 rounded-3xl font-semibold text-lg">
        Update Background Image
      </button>
    </div>

    <!-- FEATURED INNOVATIONS -->
    <div class="glass rounded-3xl p-8 mt-10">
      <h2 class="text-2xl font-semibold mb-6">Featured Innovations</h2>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
        <input id="innovationSrc" type="text" placeholder="Image URL" class="glass rounded-2xl px-6 py-5">
        <input id="innovationTitle" type="text" placeholder="Title" class="glass rounded-2xl px-6 py-5">
      </div>
      <textarea id="innovationDesc" placeholder="Short description (optional)" 
                class="w-full glass rounded-2xl px-6 py-5 h-24 mb-6 resize-none"></textarea>

      <button onclick="saveInnovation()" id="innovationBtn"
              class="w-full py-5 bg-gradient-to-r from-purple-500 to-pink-600 rounded-3xl font-semibold text-lg">
        Add New Innovation
      </button>

      <div id="innovationList" class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-10"></div>
    </div>

    <!-- ALBUMS & IMAGES MANAGEMENT -->
    <div class="mt-12 space-y-16">
      <div>
        <h2 class="text-3xl font-semibold mb-6">Albums Management</h2>
        <div id="albumsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      </div>

      <div>
        <h2 class="text-3xl font-semibold mb-6">All Images Management</h2>
        <div id="allImagesList" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6"></div>
      </div>
    </div>
  </div>

  <!-- EDIT MODAL -->
  <div id="editModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50">
    <div class="glass max-w-lg w-full rounded-3xl p-8">
      <h3 class="text-2xl font-semibold mb-6" id="editModalTitle">Edit Item</h3>
      <input id="editTitle" class="w-full glass rounded-2xl px-5 py-4 mb-4">
      <input id="editUrl" class="w-full glass rounded-2xl px-5 py-4 mb-6">
      <div class="flex gap-4">
        <button onclick="saveEdit()" class="flex-1 py-4 bg-green-600 rounded-3xl font-semibold">Save Changes</button>
        <button onclick="closeEditModal()" class="flex-1 py-4 glass rounded-3xl font-semibold">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    // ==================== FIREBASE CONFIG ====================
    const firebaseConfig = {
      apiKey: "AIzaSyA6abD4TVTEAzn7jLqvf62GXKCDLg8PeNw",
      authDomain: "markmellon-874a3.firebaseapp.com",
      projectId: "markmellon-874a3",
      storageBucket: "markmellon-874a3.firebasestorage.app",
      messagingSenderId: "371160128795",
      appId: "1:371160128795:web:cf45e7edab5d82b74107be",
      measurementId: "G-XMMWYVH4HG"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentEditType = '';
    let currentEditKey = '';
    let editingInnovationKey = null;

    // ==================== BACKGROUND IMAGE ====================
    function loadCurrentBackground() {
      db.ref('background').once('value', (snap) => {
        const url = snap.val();
        const preview = document.getElementById('currentBackgroundPreview');
        if (url) {
          preview.innerHTML = `<img src="${url}" class="w-full h-full object-cover">`;
          updateLivePreview(url);
        } else {
          preview.innerHTML = `<div class="h-full flex items-center justify-center text-zinc-500 p-8 text-center">No background image set yet</div>`;
        }
      });
    }

    function updateBackgroundImage() {
      const url = document.getElementById('backgroundUrlInput').value.trim();
      if (!url) return alert("Please enter a valid image URL");

      db.ref('background').set(url).then(() => {
        alert("✅ Background image updated successfully!");
        document.getElementById('backgroundUrlInput').value = '';
        loadCurrentBackground();
      }).catch(err => alert("Error: " + err.message));
    }

    // ==================== FEATURED INNOVATIONS ====================
    function loadInnovations() {
      const container = document.getElementById('innovationList');
      container.innerHTML = '';

      db.ref('innovation').once('value', (snap) => {
        const data = snap.val() || {};
        Object.keys(data).forEach(key => {
          const item = data[key];
          const card = `
            <div class="glass rounded-3xl p-6 card-hover">
              <img src="${item.src}" class="w-full h-48 object-cover rounded-2xl mb-4">
              <h4 class="font-semibold">${item.title}</h4>
              <p class="text-sm text-zinc-400 line-clamp-2">${item.desc || ''}</p>
              <div class="flex gap-3 mt-6">
                <button onclick="editInnovation('${key}')" class="flex-1 py-3 bg-blue-600 rounded-2xl text-sm">Edit</button>
                <button onclick="deleteInnovation('${key}')" class="flex-1 py-3 bg-red-600 rounded-2xl text-sm">Delete</button>
              </div>
            </div>`;
          container.innerHTML += card;
        });
        updateLivePreview();
      });
    }

    function saveInnovation() {
      const src = document.getElementById('innovationSrc').value.trim();
      const title = document.getElementById('innovationTitle').value.trim();
      const desc = document.getElementById('innovationDesc').value.trim();

      if (!src || !title) return alert("Image URL and Title are required!");

      const data = { src, title, desc: desc || "" };

      if (editingInnovationKey) {
        db.ref(`innovation/${editingInnovationKey}`).update(data).then(() => {
          alert("✅ Innovation updated!");
          resetInnovationForm();
        });
      } else {
        const newKey = db.ref('innovation').push().key;
        db.ref(`innovation/${newKey}`).set(data).then(() => {
          alert("✅ New innovation added!");
          resetInnovationForm();
        });
      }
    }

    function editInnovation(key) {
      editingInnovationKey = key;
      db.ref(`innovation/${key}`).once('value', (snap) => {
        const item = snap.val();
        document.getElementById('innovationSrc').value = item.src;
        document.getElementById('innovationTitle').value = item.title;
        document.getElementById('innovationDesc').value = item.desc || '';
        document.getElementById('innovationBtn').textContent = "Update Innovation";
      });
    }

    function deleteInnovation(key) {
      if (confirm("Delete this featured innovation?")) {
        db.ref(`innovation/${key}`).remove().then(() => loadInnovations());
      }
    }

    function resetInnovationForm() {
      document.getElementById('innovationSrc').value = '';
      document.getElementById('innovationTitle').value = '';
      document.getElementById('innovationDesc').value = '';
      document.getElementById('innovationBtn').textContent = "Add New Innovation";
      editingInnovationKey = null;
      loadInnovations();
    }

    // ==================== LIVE PREVIEW ====================
    function updateLivePreview(bgUrl = null) {
      const preview = document.getElementById('livePreview');
      db.ref('background').once('value', (snap) => {
        const currentBg = snap.val() || '';
        if (currentBg) {
          preview.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.7)), url('${currentBg}')`;
        }
      });
    }

    // ==================== YOUR ORIGINAL FUNCTIONS ====================
    function addNewImage() {
      const src = document.getElementById('imgSrc').value.trim();
      const title = document.getElementById('imgTitle').value.trim();
      const albumKey = document.getElementById('imgAlbum').value;

      if (!src || !title) return alert("Image URL and Title are required");

      const newKey = db.ref('allImages').push().key;
      const imageData = { id: newKey, src, title };

      const updates = {};
      updates[`allImages/${newKey}`] = imageData;
      updates[`images/${newKey}`] = imageData;

      if (albumKey) {
        updates[`albums/${albumKey}/images/${newKey}`] = { src, title };
        updates[`albums/${albumKey}/count`] = firebase.database.ServerValue.increment(1);
      }

      db.ref().update(updates).then(() => {
        alert("✅ Image added successfully!");
        clearInputs();
        loadAllData();
      });
    }

    function createNewAlbum() {
      const title = document.getElementById('albumTitle').value.trim();
      const cover = document.getElementById('albumCover').value.trim();

      if (!title || !cover) return alert("Title and Cover URL are required");

      const newKey = db.ref('albums').push().key;
      const albumData = { id: newKey, title, cover, count: 0, images: {} };

      db.ref(`albums/${newKey}`).set(albumData).then(() => {
        alert("✅ Album created!");
        document.getElementById('albumTitle').value = '';
        document.getElementById('albumCover').value = '';
        loadAllData();
      });
    }

    function loadAllData() {
      loadAlbums();
      loadAllImages();
      loadAlbumDropdown();
    }

    function loadAlbumDropdown() {
      const select = document.getElementById('imgAlbum');
      select.innerHTML = '<option value="">Add to All Images only</option>';
      db.ref('albums').once('value', snap => {
        const albums = snap.val() || {};
        Object.keys(albums).forEach(key => {
          const album = albums[key];
          const opt = document.createElement('option');
          opt.value = key;
          opt.textContent = album.title;
          select.appendChild(opt);
        });
      });
    }

    function loadAlbums() {
      const container = document.getElementById('albumsList');
      container.innerHTML = '';
      db.ref('albums').once('value', snap => {
        const data = snap.val() || {};
        Object.keys(data).forEach(key => {
          const album = data[key];
          const html = `
            <div class="glass rounded-3xl p-5 card-hover">
              <img src="${album.cover}" class="w-full h-48 object-cover rounded-2xl mb-4">
              <h4 class="font-semibold text-lg">${album.title}</h4>
              <p class="text-sm text-zinc-400">${album.count || 0} images</p>
              <div class="flex gap-3 mt-6">
                <button onclick="editAlbum('${key}')" class="flex-1 py-3 bg-blue-600 rounded-2xl text-sm">Edit</button>
                <button onclick="deleteAlbum('${key}')" class="flex-1 py-3 bg-red-600 rounded-2xl text-sm">Delete</button>
              </div>
            </div>`;
          container.innerHTML += html;
        });
      });
    }

    function loadAllImages() {
      const container = document.getElementById('allImagesList');
      container.innerHTML = '';
      db.ref('allImages').once('value', snap => {
        const data = snap.val() || {};
        Object.keys(data).forEach(key => {
          const img = data[key];
          const html = `
            <div class="glass rounded-3xl overflow-hidden card-hover">
              <img src="${img.src}" class="w-full aspect-square object-cover">
              <div class="p-4">
                <p class="font-medium line-clamp-2">${img.title}</p>
                <div class="flex gap-2 mt-4">
                  <button onclick="editImage('${key}')" class="flex-1 py-2 bg-blue-600 rounded-2xl text-xs">Edit</button>
                  <button onclick="deleteImage('${key}')" class="flex-1 py-2 bg-red-600 rounded-2xl text-xs">Delete</button>
                </div>
              </div>
            </div>`;
          container.innerHTML += html;
        });
      });
    }

    function editImage(key) {
      currentEditType = 'image';
      currentEditKey = key;
      db.ref(`allImages/${key}`).once('value', snap => {
        const data = snap.val();
        document.getElementById('editModalTitle').textContent = "Edit Image";
        document.getElementById('editTitle').value = data.title || '';
        document.getElementById('editUrl').value = data.src || '';
        document.getElementById('editModal').classList.remove('hidden');
      });
    }

    function editAlbum(key) {
      currentEditType = 'album';
      currentEditKey = key;
      db.ref(`albums/${key}`).once('value', snap => {
        const data = snap.val();
        document.getElementById('editModalTitle').textContent = "Edit Album";
        document.getElementById('editTitle').value = data.title || '';
        document.getElementById('editUrl').value = data.cover || '';
        document.getElementById('editModal').classList.remove('hidden');
      });
    }

    function saveEdit() {
      const title = document.getElementById('editTitle').value.trim();
      const url = document.getElementById('editUrl').value.trim();
      if (!title || !url) return alert("Both fields are required");

      if (currentEditType === 'image') {
        db.ref(`allImages/${currentEditKey}`).update({ title, src: url });
        db.ref(`images/${currentEditKey}`).update({ title, src: url });
      } else if (currentEditType === 'album') {
        db.ref(`albums/${currentEditKey}`).update({ title, cover: url });
      }

      closeEditModal();
      loadAllData();
      alert("✅ Changes saved!");
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
    }

    function deleteImage(key) {
      if (!confirm("Delete this image permanently?")) return;
      db.ref(`allImages/${key}`).remove();
      db.ref(`images/${key}`).remove();
      loadAllData();
    }

    function deleteAlbum(key) {
      if (!confirm("Delete this album and all its images?")) return;
      db.ref(`albums/${key}`).remove();
      loadAllData();
    }

    function clearInputs() {
      document.getElementById('imgSrc').value = '';
      document.getElementById('imgTitle').value = '';
    }

    function refreshAll() {
      loadAllData();
      loadCurrentBackground();
      loadInnovations();
    }

    function logout() {
      if (confirm("Logout from Admin Panel?")) {
        window.location.href = "index.html";
      }
    }

    // ==================== INITIALIZE ====================
    window.onload = function() {
      loadAllData();
      loadCurrentBackground();
      loadInnovations();
      updateLivePreview();

      // Auto refresh every 20 seconds
      setInterval(() => {
        loadAllData();
        loadCurrentBackground();
        loadInnovations();
      }, 20000);

      console.log('%c✅ MARKMELLON ADMIN PANEL - Fully Fixed & Ready', 'color:#60a5fa; font-weight:bold');
    };
  </script>
</body>
</html>
